name: Theme CI (PR3)

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - preview
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run CI checks
        env:
          CI: 'true'
          CI_ENABLE_SECURITY_SMOKE: ${{ vars.CI_ENABLE_SECURITY_SMOKE || 'false' }}
        run: bash tools/ci/run.sh
