name: Release Assets

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      git_ref:
        description: "要发版的 Git ref（默认 release）"
        required: false
        default: "release"

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-assets:
    if: github.event_name != 'push' || (github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip release]'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Bump patch version
        id: bump
        run: |
          version_output="$(python tools/release/bump_release_version.py)"
          echo "${version_output}"
          current_version="$(echo "${version_output}" | sed -n 's/^CURRENT_VERSION=//p' | head -n1)"
          next_version="$(echo "${version_output}" | sed -n 's/^NEXT_VERSION=//p' | head -n1)"
          if [[ -z "${next_version}" ]]; then
            echo "未能解析新版本号" >&2
            exit 1
          fi
          echo "current_version=${current_version}" >> "${GITHUB_OUTPUT}"
          echo "next_version=${next_version}" >> "${GITHUB_OUTPUT}"

      - name: Check bumped versions
        run: python tools/release/check_release_version.py "v${{ steps.bump.outputs.next_version }}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add style.css
          git commit -m "chore(release): v${{ steps.bump.outputs.next_version }} [skip release]"
          git push origin HEAD:release

      - name: Create and push tag
        run: |
          git tag "v${{ steps.bump.outputs.next_version }}"
          git push origin "v${{ steps.bump.outputs.next_version }}"

      - name: Build release artifacts
        run: python tools/release/build_release_artifacts.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/release

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.next_version }}
          name: v${{ steps.bump.outputs.next_version }}
          generate_release_notes: true
          files: |
            dist/release/*.zip
            dist/release/manifest.json
